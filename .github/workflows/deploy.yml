- name: Deploy via SSH
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.SSH_HOST }}
    username: ${{ secrets.SSH_USER }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
    command_timeout: 300s
    command: |
      ssh -v -o StrictHostKeyChecking=no user@host
      cd /var/www/html/adminUATMadhav/sprintnxtadminbackenduat
      ./deploy.sh
